name: Build & Publish Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize Image Owner
        run: |
          echo "IMAGE_OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./client-acc
          file: ./client-acc/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER_LC }}/acc-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER_LC }}/acc-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=https://acc.iitp.ac.in/api

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./server-acc
          file: ./server-acc/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER_LC }}/acc-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER_LC }}/acc-backend:${{ github.sha }}

      - name: Build and Push SMP Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./smp/client
          file: ./smp/client/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER_LC }}/smp-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER_LC }}/smp-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=https://acc.iitp.ac.in/smp/api

      - name: Build and Push SMP Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./smp/server
          file: ./smp/server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER_LC }}/smp-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER_LC }}/smp-backend:${{ github.sha }}

      - name: Build and Push SMP Allocation Engine Image
        uses: docker/build-push-action@v6
        with:
          context: ./smp/allocation_engine
          file: ./smp/allocation_engine/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER_LC }}/smp-allocation:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER_LC }}/smp-allocation:${{ github.sha }}

  deploy:
    name: Deploy to Production
    needs: build-and-push

    runs-on:
      - self-hosted
      - production
      - acc

    steps:
      - name: Deploy to Production
        run: |
          set -e

          cd /home/iitp/Academic-Council-Portal

          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/" .env.prod

          docker compose \
            -f docker-compose.prod.yml \
            --env-file .env.prod \
            pull

          docker compose \
            -f docker-compose.prod.yml \
            --env-file .env.prod \
            up -d

          sleep 10

          docker exec acc-backend \
            npx prisma migrate deploy

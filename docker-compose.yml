services:
  nginx-acc:
    image: nginx:alpine
    container_name: acc-nginx
    ports:
      - "80:80"
      - "443:443" 
    volumes:
      - ./nginx-acc/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-acc/conf.d:/etc/nginx/conf.d:ro
      - ./nginx-acc/logs:/var/log/nginx
  
      - ./certs-acc:/etc/nginx/ssl:ro
    depends_on:
      - frontend-acc
      - backend-acc
      - minio-acc
      - smp-frontend
      - smp-backend
    networks:
      - acc-net

  frontend-acc:
    build:
      context: ./client-acc
      dockerfile: Dockerfile

    container_name: acc-frontend

    restart: unless-stopped

    networks:
      - acc-net

  postgres-acc:
    image: postgres:16
    container_name: acc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - acc_postgres:/var/lib/postgresql/data
    networks:
      - acc-net
      
  minio-acc:
    image: minio/minio
    container_name: acc-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - acc-net

  backend-acc:
    build:
      context: ./server-acc
      dockerfile: Dockerfile
    container_name: acc-backend
    restart: unless-stopped
    env_file:
      - ./server-acc/.env
    depends_on:
      - postgres-acc
    networks:
      - acc-net

  smp-mongo:
    image: mongo:latest
    container_name: smp-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - smp_mongo_data:/data/db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try {
            const status = rs.status();
            if (status.ok) quit(0); else quit(1);
          } catch(e) {
            rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'smp-mongo:27017'}]});
            quit(1);
          }
        "
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - acc-net

  smp-backend:
    build:
      context: ./smp/server
      dockerfile: Dockerfile
    container_name: smp-backend
    restart: unless-stopped
    env_file:
      - ./smp/server/.env
    environment:
      - DATABASE_URL=mongodb://smp-mongo:27017/mydb?authSource=admin&directConnection=true
      - MINIO_ENDPOINT=minio-acc
    depends_on:
      smp-mongo:
        condition: service_healthy
      minio-acc:
        condition: service_started
    networks:
      - acc-net

  smp-frontend:
    build:
      context: ./smp/client
      dockerfile: Dockerfile
    container_name: smp-frontend
    restart: unless-stopped
    networks:
      - acc-net

volumes:
  acc_postgres:
  minio_data:
  smp_mongo_data:

networks:
  acc-net:

version: "3.8"

services:
  nginx-acc:
    image: nginx:alpine
    container_name: acc-nginx
    ports:
      - "80:80"
      - "443:443" 
    volumes:
      - ./nginx-acc/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-acc/conf.d:/etc/nginx/conf.d:ro
      - ./client-acc/dist:/usr/share/nginx/html:ro
      - ./nginx-acc/logs:/var/log/nginx
  
      - ./certs-acc:/etc/nginx/ssl:ro
    depends_on:
      - backend-acc
      - minio-acc
    networks:
      - acc-net

  postgres-acc:
    image: postgres:16
    container_name: acc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - acc_postgres:/var/lib/postgresql/data
    networks:
      - acc-net
      
  minio-acc:
    image: minio/minio
    container_name: acc-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - acc-net

  backend-acc:
    build:
      context: ./server-acc
      dockerfile: Dockerfile
    container_name: acc-backend
    restart: unless-stopped
    env_file:
      - ./server-acc/.env
    depends_on:
      - postgres-acc
    networks:
      - acc-net

volumes:
  acc_postgres:
  minio_data:

networks:
  acc-net:

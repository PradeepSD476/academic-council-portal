# Academic Council Portal - Frontend
#
# IMPORTANT: upstreams are referenced via variables + Docker's embedded DNS
# (127.0.0.11, valid=10s). Nginx normally resolves proxy_pass hostnames ONCE at
# startup and caches the IP forever; when a backend container is recreated
# (docker compose up -d --force-recreate backend-acc), it gets a NEW IP and the
# cached one goes dead -> 502 until nginx is manually restarted. With the
# resolver + variable pattern, nginx re-resolves every 10s and self-heals.
# Do not convert these back to static proxy_pass http://service:port form.

server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=10s ipv6=off;

    set $acc_frontend http://frontend-acc:80;
    set $acc_backend   http://backend-acc:3000;

    # Proxy all requests to frontend-acc container (which serves the React app)
    location / {
        proxy_pass $acc_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API routes go to backend-acc
    location /api/v1/ {
        proxy_pass $acc_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass $acc_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

